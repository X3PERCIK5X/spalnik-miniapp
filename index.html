<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>Спальник — Меню</title>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css?v=20260416-194500" />
</head>

<body>
  <!-- Верхняя панель -->
  <header class="topbar">
    <div class="topbar-left">
      <img class="topbar-logo" src="logo.jpeg" alt="Спальник" />
    </div>

  <div class="topbar-right">
    <button id="historyButton" class="history-button" type="button">Мои заказы</button>
    <button id="cartButton" class="cart-button" type="button" aria-label="Корзина">
      <img src="корзина.png" alt="" class="cart-icon" />
      <span id="cartCount">0</span>
    </button>
  </div>
  </header>

  <!-- Переключатель -->
  <div class="top-tabs">
    <button id="tabBooking" class="tab-btn active" type="button">Забронировать стол</button>
    <button id="tabMenu" class="tab-btn" type="button">Меню</button>
  </div>

  <!-- Меню -->
  <section id="menuSection">
    <div id="categories" class="categories"></div>
    <main id="menu" class="menu"></main>
  </section>

  <!-- Бронь -->
  <section id="bookingSection" class="booking hidden">
    <div class="booking-card">
      <div class="booking-title">Бронирование стола</div>

      <div class="booking-quick">
        <div class="booking-quick-group">
          <div class="booking-quick-label">Дата</div>
          <div class="booking-chips">
            <button class="booking-chip" type="button" data-booking-date="today">Сегодня</button>
            <button class="booking-chip" type="button" data-booking-date="tomorrow">Завтра</button>
            <button class="booking-chip" type="button" data-booking-date="next">Сб</button>
          </div>
        </div>
        <div class="booking-quick-group">
          <div class="booking-quick-label">Время</div>
          <div class="booking-chips">
            <button class="booking-chip" type="button" data-booking-time="19:00">19:00</button>
            <button class="booking-chip" type="button" data-booking-time="20:00">20:00</button>
            <button class="booking-chip" type="button" data-booking-time="21:00">21:00</button>
          </div>
        </div>
      </div>

      <div class="booking-fields">
        <div class="booking-row">
          <div class="booking-block">
            <label>
              Дата *
              <input id="bookingDate" type="text" placeholder="ДД.ММ.ГГГГ" />
            </label>
          </div>

          <div class="booking-block">
            <label>
              Время *
              <input id="bookingTime" type="text" placeholder="ЧЧ:ММ" />
            </label>
          </div>
        </div>

        <div class="booking-block">
          <label>
            Имя *
            <input id="bookingName" type="text" placeholder="Имя и фамилия гостя" />
          </label>
          <label>
            Телефон *
            <input id="bookingPhone" type="text" placeholder="+7..." />
          </label>
          <label>
            Количество гостей *
            <div class="booking-stepper">
              <button id="bookingGuestsMinus" class="booking-stepper-btn" type="button" aria-label="Уменьшить">−</button>
              <input id="bookingGuests" type="number" min="1" max="50" placeholder="2" />
              <button id="bookingGuestsPlus" class="booking-stepper-btn" type="button" aria-label="Увеличить">+</button>
            </div>
          </label>
          <label>
            Комментарий (необязательно)
            <input id="bookingComment" type="text" placeholder="Пожелания по бронированию" />
          </label>
        </div>
      </div>

      <div id="bookingStatus" class="booking-status"></div>
      <button id="bookingSend" class="send-order" type="button">Забронировать стол</button>
      <button id="bookingMenuLink" class="booking-menu-link" type="button">Хотите заказать заранее? Перейти в меню</button>

      <div id="bookingSuccess" class="booking-success hidden">
        <div class="booking-success-title">Стол забронирован</div>
        <div class="booking-success-text">Хотите оформить предзаказ заранее?</div>
        <button id="bookingSuccessMenu" class="booking-success-link" type="button">Перейти в меню</button>
      </div>
    </div>
  </section>

  <!-- КОРЗИНА -->
  <div id="cartScreen" class="cart hidden">
    <div class="cart-header">
      <button id="closeCart" class="back-btn">← Назад</button>
      <h2>Корзина</h2>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-form">
      <label>
        Telegram
        <div id="tgProfile" class="tg-profile">—</div>
      </label>

      <label>
        Телефон для подтверждения *
        <input id="phoneInput" type="text" placeholder="+7..." />
      </label>

      <label>
        К какому времени приготовить *
        <input id="timeInput" type="text" placeholder="ЧЧ:ММ" />
      </label>

      <label>
        Комментарий (необязательно)
        <input id="commentInput" type="text" placeholder="Без лука" />
      </label>
    </div>

    <div class="cart-footer">
      <div class="cart-total">
        Итого: <span id="totalPrice">0</span> ₽
      </div>
      <div id="statusBox" style="margin-top:10px; opacity:.85; font-size:14px;"></div>
      <button id="sendOrder" class="send-order">
        Отправить предзаказ
      </button>
    </div>
  </div>

  <!-- МОИ ЗАКАЗЫ -->
  <div id="ordersScreen" class="orders hidden">
    <div class="orders-header">
      <button id="closeOrders" class="back-btn">← Назад</button>
      <h2>Мои заказы</h2>
    </div>
    <div id="orderHistory" class="order-history"></div>
  </div>

  <!-- Плавающая корзина -->
  <button id="cartFab" class="cart-fab hidden" type="button">
    <img src="корзина.png" alt="" class="cart-icon" />
    <span class="cart-fab-title">Корзина</span>
    <span class="cart-fab-dot">·</span>
    <span class="cart-fab-total"><span id="cartFabTotal">0</span> ₽</span>
    <span class="cart-fab-count" id="cartFabCount">0</span>
  </button>

  <!-- Скрипты -->
  <script>
    // Альтернативный канал доставки заказа (Cloudflare Worker)
    window.SPALNIK_API_URL = "https://spalnik-order.2000sanchezperez.workers.dev";
    window.SPALNIK_API_KEY = "spalnik_key_123";
  </script>
  <script>
    // Блокируем двойной тап (iOS Safari) для предотвращения зума
    let __lastTouchEnd = 0;
    document.addEventListener("touchend", function (e) {
      const now = Date.now();
      if (now - __lastTouchEnd < 300) e.preventDefault();
      __lastTouchEnd = now;
    }, { passive: false });
  </script>
  <script defer src="menu.js?v=20260416-194500"></script>
  <script defer src="telegram.js?v=20260416-194500"></script>
  <script defer src="cart.js?v=20260416-194500"></script>
</body>
</html>
